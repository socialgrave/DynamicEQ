name: Build & Release DynamicEQ

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Fetch Fishhook
      run: |
        curl -sL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o fishhook.c
        curl -sL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o fishhook.h

    - name: Compile Dylib
      run: |
        clang -dynamiclib -O3 -w -fobjc-arc \
        -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
        -arch arm64 -miphoneos-version-min=14.0 \
        -framework AudioToolbox -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore \
        Tweak.m fishhook.c -o DynamicEQ.dylib

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: DynamicEQ v1.0.0
        body: |
          🚀 **Официальный релиз DynamicEQ PRO v1.0.0**
          
          ### Что внутри:
          - 10-полосный параметрический эквалайзер
          - Защита от клиппинга и прострелов (Tape Saturation `tanh`)
          - Режим инфра-баса `SubShelf 20-55Hz`
          - Сохранение пресетов и импорт кодов
          - Кнопка сравнения `EQ ON/OFF`
          - Живой VU-meter индикатор
        files: DynamicEQ.dylib
        draft: false
        prerelease: false
